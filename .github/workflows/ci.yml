name: bootstrap
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # M2 窗口：连续 7 个自然日每天至少 1 次实际运行且成功（06-Dune与CI上线门禁.md；2026-11-08 主人裁定）。
    # 每日 03:00 UTC（11:00 北京时间）跑一次全量作业；缺日、失败、取消均使窗口重新开始。
    - cron: '0 3 * * *'
permissions:
  contents: read
jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository contracts
        run: python3 scripts/check_repository.py
  capability-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run every capabilities/*/tests suite (an empty set fails)
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(capabilities/*/tests)
          if [ "${#dirs[@]}" -eq 0 ]; then echo "no capability test suites found"; exit 1; fi
          for d in "${dirs[@]}"; do echo "== $d"; python3 -m unittest discover -s "$d" -v; done
      - name: Real R2 misaddressed card must be rejected (exit 4)
        run: |
          set +e
          python3 capabilities/handoff_recipient/check.py --self "Apo·内容" --aliases capabilities/handoff_recipient/fixtures/aliases.json capabilities/handoff_recipient/fixtures/r2-card-a.txt
          rc=$?
          set -e
          test "$rc" -eq 4
  event-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run C2/C5 gate rule tests
        run: python3 -m unittest discover -s control/gate/tests -v
      - name: Replay fixture log and verify ledger byte-for-byte
        run: python3 control/gate/gate.py verify --config control/gate/example/config.json --events control/gate/example/events.jsonl --ledger control/gate/example/ledger.json
      - name: Tampered ledger must be reported as REGRESSION (exit 1)
        run: |
          sed 's/"streak":3/"streak":4/' control/gate/example/ledger.json > "$RUNNER_TEMP/tampered.json"
          set +e
          python3 control/gate/gate.py verify --config control/gate/example/config.json --events control/gate/example/events.jsonl --ledger "$RUNNER_TEMP/tampered.json"
          rc=$?
          set -e
          test "$rc" -eq 1
  loop-history-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run non-empty C6 history v2 suite
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("control/loop_status/tests")
          if suite.countTestCases() == 0:
              raise SystemExit("no history tests discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
  review-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run nonempty independence suite and assert red-green fixture exits
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          import unittest
          root = "capabilities/review_independence"
          suite = unittest.defaultTestLoader.discover(root + "/tests")
          if not suite.countTestCases():
              raise SystemExit("no review-independence tests discovered")
          if not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful():
              raise SystemExit(1)
          head = "1526ea1bc733612dba4f814ecb220ea2330e0646"
          for fixture, code in (
              ("receipt-self-review.json", 1),
              ("receipt-stale-head.json", 1),
              ("receipt-valid.json", 0),
          ):
              p = subprocess.run(
                  [sys.executable, root + "/check.py", "check",
                   "--pr-author", "TaiLaiCai", "--pr-head-sha", head,
                   "--receipt", root + "/fixtures/" + fixture],
                  capture_output=True, text=True, timeout=30)
              print(fixture, "rc=" + str(p.returncode), p.stdout, end="")
              if p.returncode != code:
                  raise SystemExit("fixture regression: " + fixture)
          PY
      - name: Apply gate to PR-declared rerun receipts (if any)
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(docs/reviews/independence/*.json)
          if [ "${#receipts[@]}" -gt 0 ]; then
            args=()
            for f in "${receipts[@]}"; do args+=(--receipt "$f"); done
            python3 capabilities/review_independence/check.py check \
              --pr-author "$PR_AUTHOR" --pr-head-sha "$PR_HEAD" "${args[@]}"
          else
            echo "no receipts declared under docs/reviews/independence/; machine enforcement deferred until ruleset inclusion (NOT_TESTED)"
          fi
  handoff-recipient-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Nonempty recipient suite and real red-green fixture
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          import unittest
          root = "capabilities/handoff_recipient"
          suite = unittest.defaultTestLoader.discover(root + "/tests")
          if not suite.countTestCases():
              raise SystemExit("no recipient tests discovered")
          if not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful():
              raise SystemExit(1)
          for me, code, verdict in (("内容", 4, "MISADDRESSED"), ("市场情报", 0, "ACCEPT")):
              p = subprocess.run(
                  [sys.executable, root + "/check.py", "--self", me,
                   "--aliases", root + "/fixtures/aliases.json", root + "/fixtures/r2-card-a.txt"],
                  capture_output=True, text=True, timeout=10)
              print(me, "rc=" + str(p.returncode), p.stdout, end="")
              if p.returncode != code or json.loads(p.stdout)["verdict"] != verdict:
                  raise SystemExit("real fixture regression")
          PY
  handoff-conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run nonempty convention suite and assert red and green exits
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          import unittest
          root = "capabilities/handoff_conventions"
          suite = unittest.defaultTestLoader.discover(root + "/tests")
          count = suite.countTestCases()
          if not count:
              raise SystemExit("no convention tests discovered")
          if not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful():
              raise SystemExit(1)
          for fixture, code, verdict in (
              ("undefined.txt", 3, "NEEDS_CLARIFICATION"),
              ("defined.txt", 0, "LEXICAL_CLEAR"),
          ):
              p = subprocess.run(
                  [sys.executable, root + "/check.py", root + "/fixtures/" + fixture],
                  capture_output=True, text=True, timeout=10)
              print(fixture, "rc=" + str(p.returncode), p.stdout, end="")
              if p.returncode != code or json.loads(p.stdout)["verdict"] != verdict:
                  raise SystemExit("fixture regression: " + fixture)
          PY
