<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <title>AI Trust Review · Grok × Claude × Codex collaborative training</title>
  <desc>Original architecture diagram. Names are used as text labels only; no logos. Not affiliated with or endorsed by xAI, Anthropic or OpenAI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa3c7"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#8fa3c7">
    <path d="M0 95 H1200 M0 190 H1200 M0 285 H1200 M0 380 H1200 M0 475 H1200 M0 570 H1200 M0 665 H1200"/>
    <path d="M100 0 V760 M250 0 V760 M400 0 V760 M550 0 V760 M700 0 V760 M850 0 V760 M1000 0 V760 M1150 0 V760"/>
  </g>

  <text x="600" y="52" text-anchor="middle" fill="#e8eefc" font-size="28" font-weight="700">AI 信任审查 · Collaborative Trust Training</text>
  <text x="600" y="82" text-anchor="middle" fill="#8fa3c7" font-size="15">Grok-inspired Dune architecture · Claude trains &amp; reviews · Codex engineers &amp; re-runs · Owner approves</text>

  <!-- Owner -->
  <g>
    <rect x="470" y="110" width="260" height="70" rx="14" fill="#1d2a47" stroke="#f2c14e" stroke-width="2"/>
    <text x="600" y="140" text-anchor="middle" fill="#f2c14e" font-size="18" font-weight="700">主人 · Owner</text>
    <text x="600" y="164" text-anchor="middle" fill="#c9d4ec" font-size="13">唯一批准人 · stage / permission / merge</text>
  </g>

  <!-- Grok (framework inspiration) -->
  <g>
    <rect x="40" y="230" width="300" height="150" rx="16" fill="#151f36" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="80" cy="268" r="18" fill="#a78bfa" opacity="0.9"/>
    <text x="80" y="274" text-anchor="middle" fill="#0b1220" font-size="16" font-weight="800">G</text>
    <text x="110" y="266" fill="#e8eefc" font-size="20" font-weight="700">Grok · Dune</text>
    <text x="110" y="288" fill="#a78bfa" font-size="13">思路来源 · design inspiration</text>
    <text x="60" y="318" fill="#c9d4ec" font-size="13">• 原子能力 · atomic capabilities</text>
    <text x="60" y="340" fill="#c9d4ec" font-size="13">• 控制面 / 工作面分离 · plane isolation</text>
    <text x="60" y="362" fill="#c9d4ec" font-size="13">• 纠正即约束 · corrections → constraints</text>
  </g>

  <!-- Claude -->
  <g filter="url(#glow)">
    <rect x="400" y="230" width="400" height="150" rx="16" fill="#1a2744" stroke="#f08a5d" stroke-width="2.5"/>
  </g>
  <circle cx="440" cy="268" r="18" fill="#f08a5d"/>
  <text x="440" y="274" text-anchor="middle" fill="#0b1220" font-size="16" font-weight="800">C</text>
  <text x="470" y="266" fill="#e8eefc" font-size="20" font-weight="700">Claude · 训练者 Trainer</text>
  <text x="470" y="288" fill="#f08a5d" font-size="13">冻结判据 · 独立重算 SHA · 定时推进 8×/日</text>
  <text x="420" y="318" fill="#c9d4ec" font-size="13">• 出题与陷阱设计（判据不入 Bot 上下文）</text>
  <text x="420" y="340" fill="#c9d4ec" font-size="13">• Frozen criteria · byte-level evidence review</text>
  <text x="420" y="362" fill="#c9d4ec" font-size="13">• 复跑 Codex PR · cross-model technical review</text>

  <!-- Codex -->
  <g>
    <rect x="860" y="230" width="300" height="150" rx="16" fill="#152a2a" stroke="#3ecf8e" stroke-width="2.5"/>
    <circle cx="900" cy="268" r="18" fill="#3ecf8e"/>
    <text x="900" y="274" text-anchor="middle" fill="#0b1220" font-size="16" font-weight="800">X</text>
    <text x="930" y="266" fill="#e8eefc" font-size="20" font-weight="700">Codex · 工程</text>
    <text x="930" y="288" fill="#3ecf8e" font-size="13">Engineering &amp; re-runs</text>
    <text x="880" y="318" fill="#c9d4ec" font-size="13">• C4 身份 · C6 闭环 · E04 触发</text>
    <text x="880" y="340" fill="#c9d4ec" font-size="13">• 独立复跑 Claude PR</text>
    <text x="880" y="362" fill="#c9d4ec" font-size="13">• Independent re-runs, head-bound</text>
  </g>

  <!-- shared inbox -->
  <g>
    <rect x="560" y="410" width="460" height="52" rx="26" fill="#0f1a30" stroke="#5b7bd5" stroke-width="1.5"/>
    <text x="790" y="442" text-anchor="middle" fill="#c9d4ec" font-size="14">共享收件箱 · Shared inbox (append-only, SHA-verified)</text>
  </g>

  <!-- orchestrator + bots -->
  <g>
    <rect x="120" y="510" width="420" height="200" rx="16" fill="#18223b" stroke="#5b7bd5" stroke-width="2"/>
    <text x="330" y="545" text-anchor="middle" fill="#e8eefc" font-size="18" font-weight="700">Apo·总参谋 · Orchestrator</text>
    <text x="330" y="568" text-anchor="middle" fill="#8fa3c7" font-size="13">原样派发 · verbatim dispatch via kanban</text>
    <g font-size="12" fill="#0b1220" font-weight="600">
      <rect x="145" y="590" width="86" height="30" rx="8" fill="#8fb5ff"/><text x="188" y="610" text-anchor="middle">执行者</text>
      <rect x="241" y="590" width="86" height="30" rx="8" fill="#8fb5ff"/><text x="284" y="610" text-anchor="middle">验收</text>
      <rect x="337" y="590" width="86" height="30" rx="8" fill="#8fb5ff"/><text x="380" y="610" text-anchor="middle">内容</text>
      <rect x="433" y="590" width="86" height="30" rx="8" fill="#8fb5ff"/><text x="476" y="610" text-anchor="middle">市场情报</text>
      <rect x="145" y="630" width="86" height="30" rx="8" fill="#8fb5ff"/><text x="188" y="650" text-anchor="middle">信任曲线</text>
      <rect x="241" y="630" width="86" height="30" rx="8" fill="#8fb5ff"/><text x="284" y="650" text-anchor="middle">团队协议</text>
      <rect x="337" y="630" width="86" height="30" rx="8" fill="#8fb5ff"/><text x="380" y="650" text-anchor="middle">代码图谱</text>
      <rect x="433" y="630" width="86" height="30" rx="8" fill="#f2c14e"/><text x="476" y="650" text-anchor="middle">§13 工具</text>
    </g>
    <text x="330" y="690" text-anchor="middle" fill="#8fa3c7" font-size="12">LightVela · 总参谋 + 7 bots · §13 = 开工前收件人检查工具</text>
  </g>

  <!-- GitHub CI -->
  <g>
    <rect x="660" y="510" width="420" height="200" rx="16" fill="#18223b" stroke="#3ecf8e" stroke-width="2"/>
    <text x="870" y="545" text-anchor="middle" fill="#e8eefc" font-size="18" font-weight="700">GitHub · PR + CI Gates</text>
    <text x="870" y="568" text-anchor="middle" fill="#8fa3c7" font-size="13">main ruleset · PR only · no force-push</text>
    <g font-size="13" fill="#c9d4ec">
      <text x="690" y="602">✓ repository-contracts</text>
      <text x="690" y="626">✓ capability-tests (non-empty suites)</text>
      <text x="690" y="650">✓ event-gate (replay + tamper → REGRESSION)</text>
      <text x="690" y="680" fill="#f2c14e">auto candidate stage ≤ 2 · effective stage = owner only</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#8fa3c7" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M340 305 H395"/>
    <path d="M800 305 H855"/>
    <path d="M600 380 V420 H560" />
    <path d="M1010 380 V405"/>
    <path d="M520 380 Q480 450 400 505"/>
    <path d="M880 462 V505"/>
    <path d="M540 610 H655"/>
    <path d="M600 180 V225"/>
  </g>
  <g font-size="12" fill="#8fa3c7">
    <text x="352" y="296">principles</text>
    <text x="808" y="296">review ⇄</text>
    <text x="420" y="470">交接单 handoff</text>
    <text x="560" y="600">evidence</text>
    <text x="610" y="210">approve</text>
  </g>

  <text x="600" y="745" text-anchor="middle" fill="#5f7096" font-size="11">Original diagram · names as text only · not affiliated with or endorsed by xAI, Anthropic or OpenAI · 非官方，仅示意本项目分工</text>
</svg>
